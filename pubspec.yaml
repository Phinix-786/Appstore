name: appstore
description: "Professional App Store - GitHub-powered APK distribution"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  timeago: ^3.7.0
  dio: ^5.7.0
  permission_handler: ^11.3.1
  open_filex: ^4.5.0
  package_info_plus: ^8.1.2
  device_info_plus: ^11.2.0
  connectivity_plus: ^6.1.0
  carousel_slider: ^5.0.0
  flutter_staggered_grid_view: ^0.7.0
  badges: ^3.1.2
  percent_indicator: ^4.2.3
  flutter_local_notifications: ^18.0.1
  crypto: ^3.0.6
  archive: ^4.0.2
  android_intent_plus: ^5.1.0
  share_plus: ^10.1.3
  video_player: ^2.9.2
  chewie: ^1.8.5
  expandable_text: ^2.3.0
  pull_to_refresh: ^2.0.0
  infinite_scroll_pagination: ^4.1.0
  animations: ^2.0.11
  lottie: ^3.1.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_slidable: ^3.1.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/animations/
